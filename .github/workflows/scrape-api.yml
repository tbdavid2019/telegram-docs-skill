on:
  push:
    branches: [main]
  workflow_dispatch: {} # Allow manually kicking off builds
  schedule:
    # GitHub may delay or drop jobs scheduled at the top of the hour.
    # Changing the cron also re-enables a disabled scheduled workflow.
    - cron:  '17 12 * * *' # Every day at 12:17 UTC.
name: Scrape telegram bot API
jobs:
  build:
    name: Scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: >
        pip install -r requirements.txt

    - name: Scrape website
      run: python scrape.py

    - name: Commit updated docs to main
      run: |
        if git diff --quiet; then
          echo "No documentation changes detected."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Regenerate bot API docs."
        git push origin HEAD:main
