on:
  push:
    branches: [main]
  workflow_dispatch: {} # Allow manually kicking off builds
  schedule:
    - cron: '23 12 * * *'
name: Scrape telegram bot API

concurrency:
  group: telegram-docs-sync
  cancel-in-progress: false
jobs:
  build:
    name: Scrape
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: >
        pip install -r requirements.txt

    - name: Scrape website
      run: python scrape.py
    - name: Validate snapshot provenance and lookup files
      run: |
        test -s docs/SOURCE.json
        test -s docs/INDEX.md
        test -s docs/methods/sendMessage.md
        test -s docs/types/Update.md

    - name: Commit updated docs to main
      run: |
        git add -A -- docs
        if git diff --cached --quiet; then
          echo "No documentation changes detected."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Regenerate bot API docs."
        git push origin HEAD:main
